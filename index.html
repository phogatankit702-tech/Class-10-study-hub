    function renderSubjectContainers() {
      const subjects = ["science", "maths", "sst", "english", "hindi"];

      subjects.forEach((subjectKey) => {
        const container = document.getElementById(`${subjectKey}-container`);
        container.innerHTML = "";
        
        const subjData = chaptersData[subjectKey];

        subjData.items.forEach((ch, idx) => {
          const chNum = idx + 1;
          const subjectTitleUpper = subjectKey.toUpperCase();

          let linesListHtml = "<ol class='summary-list'>";
          ch.lines.forEach((line) => {
            linesListHtml += `<li>${line}</li>`;
          });
          linesListHtml += "</ol>";

          const cardHtml = `
            <div class="chapter-card">
              <div class="chapter-header">
                <div class="chapter-title-box">
                  <span>${subjectTitleUpper} - CHAPTER ${chNum}</span>
                  <h3>${ch.title}</h3>
                  <div class="educator-tag">🎓 Master Video Lecture by: ${subjData.educator}</div>
                </div>
              </div>

              <div class="video-container">
                <iframe 
                  src="https://www.youtube.com/embed/${ch.videoId}?autoplay=0&rel=0" 
                  title="${ch.title}" 
                  allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                  allowfullscreen>
                </iframe>
              </div>

              <div class="video-fallback-bar">
                <span>▶ Open Video Directly on YouTube App/Web:</span>
                <a href="https://www.youtube.com/watch?v=${ch.videoId}" target="_blank" class="video-link-btn">
                  Watch Video (${subjData.educator})
                </a>
              </div>

              <div class="download-bar">
                <span style="font-size: 13px; font-weight: 700;">Download Complete 15-Point Chapter Sheet</span>
                <button onclick="downloadChapterPDF('${subjectTitleUpper}', '${chNum}', '${escapeQuotes(ch.title)}', ${JSON.stringify(ch.lines).replace(/"/g, '&quot;')})" class="download-btn">
                  Download Printable PDF
                </button>
              </div>

              <div class="summary-sheet">
                <h4>📌 15 High-Yield Examination Points (${ch.title})</h4>
                ${linesListHtml}
              </div>
            </div>
          `;
          container.innerHTML += cardHtml;
        });
      });
    }

    function escapeQuotes(str) {
      return str.replace(/'/g, "\\'").replace(/\n/g, "\\n");
    }

    // PDF Generator for 15 Important Points per Chapter
    function downloadChapterPDF(subject, chNum, title, lines) {
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF();

      function addHeaderFooter(doc, pageNum, totalPages) {
        doc.setFillColor(15, 23, 42);
        doc.rect(0, 0, 210, 18, 'F');
        
        doc.setFont("Helvetica", "bold");
        doc.setFontSize(11);
        doc.setTextColor(255, 255, 255);
        doc.text("Phogat Study Hub - Class 10 NCERT Revision Notes", 10, 12);
        
        doc.setFontSize(9);
        doc.text(`Page ${pageNum} of ${totalPages}`, 180, 12);

        doc.setDrawColor(203, 213, 225);
        doc.line(10, 285, 200, 285);
        doc.setFontSize(8);
        doc.setTextColor(100, 116, 139);
        doc.text("© Phogat Study Hub - Class 10 NCERT Board Examination Revision Series", 10, 290);
      }

      // Page 1 Setup
      addHeaderFooter(doc, 1, 2);
      
      doc.setFont("Helvetica", "bold");
      doc.setFontSize(14);
      doc.setTextColor(37, 99, 235);
      doc.text(`${subject} CHAPTER ${chNum}: ${title}`, 10, 28);

      doc.setFontSize(11);
      doc.setTextColor(15, 23, 42);
      doc.text("15 HIGH-YIELD BOARD EXAMINATION REVISION POINTS", 10, 36);

      doc.setFont("Helvetica", "normal");
      doc.setFontSize(9.5);
      doc.setTextColor(51, 65, 85);

      let yPos = 46;

      for (let i = 0; i < lines.length; i++) {
        if (i === 8) {
          doc.addPage();
          addHeaderFooter(doc, 2, 2);
          yPos = 28;
          doc.setFont("Helvetica", "bold");
          doc.setFontSize(11);
          doc.setTextColor(15, 23, 42);
          doc.text("15 HIGH-YIELD REVISION POINTS (CONTINUED)", 10, yPos);
          doc.setFont("Helvetica", "normal");
          doc.setFontSize(9.5);
          doc.setTextColor(51, 65, 85);
          yPos += 10;
        }

        const pointText = `${i + 1}. ${lines[i]}`;
        const splitText = doc.splitTextToSize(pointText, 190);
        doc.text(splitText, 10, yPos);
        yPos += (splitText.length * 6) + 3;
      }

      doc.save(`${subject}_Ch${chNum}_15_Important_Points.pdf`);
    }

    function filterSubject(subjectClass) {
      const buttons = document.querySelectorAll('.subject-btn');
      buttons.forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');

      const sections = document.querySelectorAll('.subject-section');
      sections.forEach(sec => {
        if (sec.classList.contains(subjectClass)) {
          sec.style.display = 'block';
        } else {
          sec.style.display = 'none';
        }
      });
    }

    function submitPaymentScreenshot() {
      const fileInput = document.getElementById('payment-shot');
      if (fileInput.files.length === 0) {
        alert('Please select your payment screenshot first.');
        return;
      }
      alert('Thank you! Payment screenshot received. Offline PDF downloads are unlocked.');
    }

    window.onload = function() {
      renderSubjectContainers();
    };
